<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://*.supabase.co; base-uri 'none'; form-action 'none'">
<title>Send a file to MIDMEN</title>
<style>
  :root { --bg:#faf9f7; --fg:#1d1b19; --muted:#6b6660; --card:#fff; --line:#e4e0da; --accent:#8c1c13; --accent-fg:#fff; --ok:#1e6b3a; --bad:#a1260d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161412; --fg:#f1ede8; --muted:#a39d95; --card:#211e1b; --line:#38332e; --accent:#e0584a; --accent-fg:#1a0f0d; --ok:#6fcf97; --bad:#ff8a73; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:flex; justify-content:center; padding:32px 16px; }
  main { width:100%; max-width:480px; }
  .brand { font-weight:700; letter-spacing:.14em; font-size:13px; color:var(--accent); margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:22px; overflow-wrap:anywhere; }
  h1 { font-size:20px; line-height:1.3; margin:0 0 6px; }
  p { margin:8px 0; } .muted { color:var(--muted); font-size:14px; }
  .drop { border:2px dashed var(--line); border-radius:10px; padding:28px 16px; text-align:center; margin:14px 0; }
  .drop.over { border-color:var(--accent); }
  button { font:inherit; font-weight:600; padding:10px 18px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-fg); cursor:pointer; }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .err { color:var(--bad); font-size:14px; margin-top:12px; } .ok { color:var(--ok); }
  input[type=file] { position:absolute; left:-9999px; }
</style>
</head>
<body>
<main>
  <div class="brand">MIDMEN</div>
  <div class="card" id="card" aria-live="polite"><p class="muted">Loading…</p></div>
  <p class="muted" style="margin-top:14px">The file goes straight to MIDMEN, to the one workspace Claude asked about. This page keeps nothing. The link works once and for one hour.</p>
</main>
<script src="upload.js"></script>
</body>
</html>
