<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://*.supabase.co; base-uri 'none'; form-action 'none'">
<title>Connect MIDMEN</title>
<style>
  :root { --bg:#faf9f7; --fg:#1d1b19; --muted:#6b6660; --card:#fff; --line:#e4e0da; --accent:#8c1c13; --accent-fg:#fff; --ok:#1e6b3a; --bad:#a1260d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161412; --fg:#f1ede8; --muted:#a39d95; --card:#211e1b; --line:#38332e; --accent:#e0584a; --accent-fg:#1a0f0d; --ok:#6fcf97; --bad:#ff8a73; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:flex; justify-content:center; padding:32px 16px; }
  main { width:100%; max-width:440px; }
  .brand { font-weight:700; letter-spacing:.14em; font-size:13px; color:var(--accent); margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:22px; }
  h1 { font-size:20px; line-height:1.3; margin:0 0 6px; }
  p { margin:8px 0; } .muted { color:var(--muted); font-size:14px; }
  ul { margin:10px 0; padding-left:20px; } li { margin:4px 0; }
  label { display:block; font-size:14px; margin:14px 0 4px; }
  input { width:100%; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .row { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
  button { font:inherit; font-weight:600; padding:10px 18px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-fg); }
  button:disabled { opacity:.55; cursor:default; }
  .err { color:var(--bad); font-size:14px; margin-top:12px; } .ok { color:var(--ok); }
  .app { font-weight:600; }
  .tag { display:inline-block; font-size:12px; border:1px solid var(--line); border-radius:99px; padding:1px 8px; color:var(--muted); }
  label.tick { display:flex; gap:10px; align-items:flex-start; margin:14px 0 4px; padding:10px 12px; border:1px solid var(--line); border-radius:6px; font-size:14px; cursor:pointer; }
  label.tick input { width:auto; margin-top:4px; flex:none; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <div class="brand">MIDMEN</div>
  <div class="card" id="card" aria-live="polite"><p class="muted">Loading…</p></div>
  <p class="muted" style="margin-top:14px">MIDMEN is the truth and trust layer for the numbers in your documents. You can disconnect any app later in the Excel add-in (Claude tab).</p>
</main>
<script src="connect.js"></script>
</body>
</html>
